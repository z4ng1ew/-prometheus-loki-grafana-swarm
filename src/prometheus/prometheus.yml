global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'node-exporter'
    dns_sd_configs:
      - names: ['tasks.node-exporter']
        type: A
        port: 9100
  - job_name: 'cadvisor'
    static_configs:
      - targets:
          - '192.168.56.10:8080'
          - '192.168.56.11:8080'
          - '192.168.56.12:8080'
  - job_name: 'booking-service'
    dns_sd_configs:
      - names: ['tasks.app_booking-service']
        type: A
        port: 8083
    metrics_path: /actuator/prometheus
  - job_name: 'report-service'
    dns_sd_configs:
      - names: ['tasks.app_report-service']
        type: A
        port: 8086
    metrics_path: /actuator/prometheus
  - job_name: 'gateway-service'
    dns_sd_configs:
      - names: ['tasks.app_gateway-service']
        type: A
        port: 8087
    metrics_path: /actuator/prometheus
  - job_name: 'session-service'
    dns_sd_configs:
      - names: ['tasks.app_session-service']
        type: A
        port: 8081
    metrics_path: /actuator/prometheus
  - job_name: 'hotel-service'
    dns_sd_configs:
      - names: ['tasks.app_hotel-service']
        type: A
        port: 8082
    metrics_path: /actuator/prometheus
  - job_name: 'payment-service'
    dns_sd_configs:
      - names: ['tasks.app_payment-service']
        type: A
        port: 8084
    metrics_path: /actuator/prometheus
  - job_name: 'loyalty-service'
    dns_sd_configs:
      - names: ['tasks.app_loyalty-service']
        type: A
        port: 8085
    metrics_path: /actuator/prometheus
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['https://google.com']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
